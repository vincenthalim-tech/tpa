name: LockedTPA
version: 1.1.0
main: com.example.lockedtpa.LockedTPAPlugin
api-version: '1.21'
description: TPA plugin dengan GUI konfirmasi, lock lokasi saat di-ACC, dan countdown 5 detik.

commands:
  tpa:
    description: Kirim permintaan teleport ke player lain
    usage: /tpa <player>
    permission: lockedtpa.use
  tpaccept:
    description: Buka GUI konfirmasi TPA dan kunci lokasi saat di-ACC
    usage: /tpaccept [player]
    permission: lockedtpa.use
  tpdeny:
    description: Tolak permintaan TPA
    usage: /tpdeny [player]
    permission: lockedtpa.use

permissions:
  lockedtpa.use:
    description: Mengizinkan penggunaan perintah TPA
    default: true
    
